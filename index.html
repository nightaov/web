<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHT IOS FF - Client Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0c0c0e; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        
        .card { width: 100%; max-width: 400px; background: #141416; border-radius: 20px; padding: 20px; border: 1px solid #27272a; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        /* Login Screen */
        h2 { font-size: 1.4rem; color: #fff; text-align: center; margin-bottom: 6px; }
        p.subtitle { font-size: 0.85rem; color: #9ca3af; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #d1d5db; }
        input[type="text"] { width: 100%; padding: 12px; background: #1c1c1f; border: 1px solid #3f3f46; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #fff; }
        .primary-btn { width: 100%; padding: 12px; background: #fff; border: none; border-radius: 12px; color: #000; font-size: 1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        .primary-btn:hover { opacity: 0.9; }
        #errorMsg { color: #f87171; font-size: 0.8rem; text-align: center; margin-top: 10px; }

        /* Dashboard Screen */
        .header { display: flex; justify-content: space-between; align-items: center; background: #1c1c1f; padding: 14px; border-radius: 14px; margin-bottom: 16px; border: 1px solid #2b2b2f; }
        .header-info h3 { font-size: 1rem; color: #fff; margin-bottom: 2px; }
        .header-info p { font-size: 0.7rem; color: #9ca3af; }
        .settings-icon { font-size: 1.2rem; cursor: pointer; }

        .section-title { font-size: 0.8rem; font-weight: bold; color: #71717a; text-transform: uppercase; margin: 16px 0 8px 4px; letter-spacing: 0.5px; }
        
        /* Image Showcase Grid */
        .image-gallery { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .image-card { background: #1c1c1f; border-radius: 14px; padding: 10px; border: 1px solid #2b2b2f; text-align: center; }
        .image-card img { width: 100%; border-radius: 10px; height: auto; display: block; margin-bottom: 8px; }
        .image-card span { font-size: 0.75rem; color: #9ca3af; font-weight: 500; }

        .logout-btn { background: #ef4444; color: white; margin-top: 16px; }
    </style>
</head>
<body>

    <!-- MẬT KHẨU / NHẬP API KEY -->
    <div id="loginCard" class="card">
        <h2>NIGHT IOS FF</h2>
        <p class="subtitle">Vui lòng nhập API Key để truy cập Client</p>
        <div class="input-group">
            <label>API Key bản quyền</label>
            <input type="text" id="apiKeyInput" placeholder="Nhập key của bạn (VD: NIGHT-2026-X)...">
        </div>
        <button class="primary-btn" onclick="verifyKey()">Xác Thực Key</button>
        <div id="errorMsg"></div>
    </div>

    <!-- GIAO DIỆN CHÍNH SAU KHI NHẬP KEY -->
    <div id="dashboardCard" class="card hidden">
        <div class="header">
            <div class="header-info">
                <h3>👑 NIGHT IOS FF</h3>
                <p>Trợ lý trong game • v1.0.0 (Đã kích hoạt)</p>
            </div>
            <div class="settings-icon">⚙️</div>
        </div>

        <div class="section-title">Xem trước giao diện Menu (3 Ảnh)</div>
        
        <!-- Khung hiển thị 3 ảnh bạn vừa gửi -->
        <div class="image-gallery">
            <div class="image-card">
                <img src="image.png" alt="Menu Tổng Quan">
                <span>1. Trang chủ & Trạng thái thiết bị</span>
            </div>
            <div class="image-card">
                <img src="image_2.png" alt="Tab ESP">
                <span>2. Tính năng ESP (Box, Line, Bone, Máu...)</span>
            </div>
            <div class="image-card">
                <img src="image_3.png" alt="Tab AIM">
                <span>3. Tính năng AIM (Aimbot, Silent, FOV...)</span>
            </div>
        </div>

        <button class="primary-btn logout-btn" onclick="logout()">Đăng Xuất / Đổi Key</button>
    </div>

    <script>
        // Cấp sẵn cho bạn 1 Key mẫu để test ngay lập tức:
        const VALID_KEY = "NIGHT-2026-VIP";

        function verifyKey() {
            const inputKey = document.getElementById('apiKeyInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (inputKey === "") {
                errorMsg.innerText = "Vui lòng không để trống API Key!";
                return;
            }

            // Kiểm tra key (bạn có thể thay đổi hoặc kết nối database sau)
            if (inputKey === VALID_KEY || inputKey.startsWith("NIGHT-")) {
                errorMsg.innerText = "";
                document.getElementById('loginCard').classList.add('hidden');
                document.getElementById('dashboardCard').classList.remove('hidden');
            } else {
                errorMsg.innerText = "API Key không hợp lệ hoặc đã hết hạn!";
            }
        }

        function logout() {
            document.getElementById('dashboardCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('apiKeyInput').value = "";
        }
    </script>
</body>
</html>
